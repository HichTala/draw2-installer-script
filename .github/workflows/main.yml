name: PyInstaller Windows
run-name: ${{ github.ref_name }} push run 🚀
on:
  push:
    branches:
    - master
jobs:
  pyinstaller:
    name: Building Installer ⚙️
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      
      - name: PyInstaller Windows
        uses: JackMcKew/pyinstaller-action-windows@v0.1.2
        with:
          path: src
